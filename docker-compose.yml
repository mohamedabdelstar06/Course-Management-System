services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: course_management
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  admin:
    build: ./admin
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://db:3306/course_management
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  public:
    build: ./public
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://db:3306/course_management
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
